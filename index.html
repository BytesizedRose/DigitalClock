<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--<div class="top-buttons"> These are for later use
        <button class="button" id="hours">Hours</button>
        <button class="button" id="minutes">Minutes</button>
        <button class="button" id="seconds">Seconds</button>
        <button class="button" id="start-stop">Start/Stop</button>
        <button class="button" id="reset">Reset</button>
    </div>-->
    <div class="clockFace">
        <!--Digit 1-->
        <div class="digi1">
            <div class="left">
                <div class="vertical h2 l1"></div>
                <div class="vertical h2 l2"></div>
            </div>
            <div class="center">
                <div class="horizontal h2 top"></div>
                <div class="horizontal h2 mid"></div>
                <div class="horizontal h2 bot"></div>
            </div>
            <div class="right">
                <div class="vertical h2 r1"></div>
                <div class="vertical h2 r2"></div>
            </div>
        </div>
        <!--Digit 2-->
        <div class="digi2">
            <div class="left">
                <div class="vertical h1 l1"></div>
                <div class="vertical h1 l2"></div>
            </div>
            <div class="center">
                <div class="horizontal h1 top"></div>
                <div class="horizontal h1 mid"></div>
                <div class="horizontal h1 bot"></div>
            </div>
            <div class="right">
                <div class="vertical h1 r1"></div>
                <div class="vertical h1 r2"></div>
            </div>
        </div>
        <div class="colon">
            <div class="topDot" id="topdot7"></div>
            <div class="bottomDot" id="botdot7"></div>
        </div>
        <!--Digit 3-->
        <div class="digi3">
            <div class="left">
                <div class="vertical m2 l1"></div>
                <div class="vertical m2 l2"></div>
            </div>
            <div class="center">
                <div class="horizontal m2 top"></div>
                <div class="horizontal m2 mid"></div>
                <div class="horizontal m2 bot"></div>
            </div>
            <div class="right">
                <div class="vertical m2 r1"></div>
                <div class="vertical m2 r2"></div>
            </div>
        </div>
        <!--Digit 4-->
        <div class="digi4">
            <div class="left">
                <div class="vertical m1 l1"></div>
                <div class="vertical m1 l2"></div>
            </div>
            <div class="center">
                <div class="horizontal m1 top"></div>
                <div class="horizontal m1 mid"></div>
                <div class="horizontal m1 bot"></div>
            </div>
            <div class="right">
                <div class="vertical m1 r1"></div>
                <div class="vertical m1 r2"></div>
            </div>
        </div>
        <div class="colon">
            <div class="topDot" id="topdot14"></div>
            <div class="bottomDot" id="botdot14"></div>
        </div>
        <!--Digit 5-->
        <div class="digi4">
            <div class="left">
                <div class="vertical s2 l1"></div>
                <div class="vertical s2 l2"></div>
            </div>
            <div class="center">
                <div class="horizontal s2 top"></div>
                <div class="horizontal s2 mid"></div>
                <div class="horizontal s2 bot"></div>
            </div>
            <div class="right">
                <div class="vertical s2 r1"></div>
                <div class="vertical s2 r2"></div>
            </div>
        </div>
        <!--Digit 6-->
        <div class="digi4">
            <div class="left">
                <div class="vertical s1 l1"></div>
                <div class="vertical s1 l2"></div>
            </div>
            <div class="center">
                <div class="horizontal s1 top"></div>
                <div class="horizontal s1 mid"></div>
                <div class="horizontal s1 bot"></div>
            </div>
            <div class="right">
                <div class="vertical s1 r1"></div>
                <div class="vertical s1 r2"></div>
            </div>
        </div>
    </div>
    <!--<div class="mode-buttons"> These are for later use
        <button class="button" id="clock">Clock Mode</button>
        <button class="button" id="timer">Timer Mode</button>
    </div>-->
<script src="script.js"></script>
</body>
</html>
